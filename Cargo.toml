[package]
name = "cheese"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
windows = { version = "0.59.0", features = [
    "Win32",
    "Win32_UI",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System",
    "Win32_System_Threading",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.135"
humantime = "2.1.0"
